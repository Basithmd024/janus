name: Janus Ecosystem Bridge CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════
  # 1. Rust Desktop Backend Verification & Security
  # ══════════════════════════════════════════════
  rust-backend-check:
    name: 🦀 Rust Core & Security Audit
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check Rust Formatting
        run: cd src-tauri && cargo fmt --all -- --check

      - name: Cargo Clippy Linter
        run: cd src-tauri && cargo clippy --no-default-features -- -D warnings

      - name: Run Backend Unit Tests
        run: cd src-tauri && cargo test --no-default-features

  # ══════════════════════════════════════════════
  # 2. Frontend Svelte 5 / TypeScript Verification
  # ══════════════════════════════════════════════
  frontend-check:
    name: ⚡ Svelte 5 & TypeScript Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Svelte Typecheck
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Build Webview Assets
        run: npm run build

  # ══════════════════════════════════════════════
  # 3. Android Kotlin & Compose Verification
  # ══════════════════════════════════════════════
  android-check:
    name: 🤖 Android Kotlin & Compose Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x android-app/gradlew

      - name: Run Android Unit Tests
        run: cd android-app && ./gradlew testDebugUnitTest

      - name: Assemble Debug APK
        run: cd android-app && ./gradlew assembleDebug

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: janus-android-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  # ══════════════════════════════════════════════
  # 4. End-to-End Security Vulnerability Scanner
  # ══════════════════════════════════════════════
  security-audit:
    name: 🛡️ Dependency & Secret Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Trufflehog Secret Scanner
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified
        continue-on-error: true
